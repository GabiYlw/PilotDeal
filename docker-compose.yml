name: pilotdeal

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pilotdeal
      POSTGRES_PASSWORD: pilotdeal
      POSTGRES_DB: pilotdeal
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilotdeal -d pilotdeal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api and web only start with the "full" profile (docker compose --profile full up -d --build),
  # so "docker compose up -d db" still starts just the database for local development.
  api:
    profiles: ["full"]
    build: ./api
    environment:
      DATABASE_URL: postgresql://pilotdeal:pilotdeal@db:5432/pilotdeal
      PORT: "3001"
      # Optional: taken from the shell or a root .env file; empty means rule-based scoring.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; /health returns 503 when the database is down.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    profiles: ["full"]
    build: ./web
    environment:
      API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
