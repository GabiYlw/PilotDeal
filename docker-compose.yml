services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dealpilot
      POSTGRES_PASSWORD: dealpilot
      POSTGRES_DB: dealpilot
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealpilot -d dealpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
